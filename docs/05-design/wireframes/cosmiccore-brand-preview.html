<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CosmicCore · Wireframe review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171522;color:#f5f0ff;font:15px/1.55 system-ui,sans-serif}button,select,input,textarea{font:inherit}button,select{cursor:pointer}button,select,input,textarea{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:inherit;padding:.6rem .85rem}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.review{max-width:1440px;margin:auto;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;--surface:#242135;--line:#514961;--accent:#c5aaff}.review strong{margin-right:auto}.review label{display:flex;align-items:center;gap:7px;font-size:13px}

.preview[data-scheme=dark]{--bg:#14131b;--surface:#211f2a;--line:#3e394c;--text:#f6f1ff;--muted:#bcb0ca;--primary:#6735c5;--accent:#c6a7ff;--selected:#362957;--soft:#292436}
.preview[data-theme=cosmic][data-scheme=dark]{--bg:#0c091b;--surface:#18142a;--line:#49395f;--muted:#c7badc;--soft:#211936;--atmosphere:radial-gradient(ellipse at 88% 0%,#54289738,transparent 56%)}
.preview[data-width=mobile]{max-width:390px}.brand{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;font-size:22px;letter-spacing:-.055em;font-weight:750}.brand b{color:var(--accent)}.mark{display:inline-block;position:relative;width:36px;height:36px;flex:none}.mark::before{content:"";position:absolute;inset:0;background:linear-gradient(148deg,#53dff4 10%,#4264ff 34%,#4b16db 57%,#ca43f2 88%);clip-path:path("M 14 2 Q 18 -1 22 2 L 32 8 Q 37 11 34 15 Q 32 18 28 16 L 20 11 Q 18 10 15 12 L 10 15 L 10 22 L 17 26 Q 19 27 21 26 L 28 21 Q 32 19 35 23 Q 37 26 33 29 L 23 35 Q 18 38 14 35 L 4 29 Q 0 27 0 22 L 0 15 Q 0 10 4 8 Z")}.mark::after{content:"";position:absolute;inset:12px 11px 11px 12px;background:linear-gradient(135deg,#8eb8ff,#bd49f2);clip-path:polygon(50% 0,67% 33%,100% 50%,67% 67%,50% 100%,33% 67%,0 50%,33% 33%)}
.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:740px;background:var(--atmosphere)}aside{background:var(--surface);border-right:1px solid var(--line);padding:25px 15px}.nav{display:grid;gap:5px;margin-top:36px}.nav button,.bottom button{border-color:transparent;background:transparent;text-align:left;color:var(--muted)}button[aria-current=page]{background:var(--selected);color:var(--text);font-weight:650}.workspace{min-width:0}.header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.header .brand,.bottom{display:none}.avatar{border-radius:50%;background:var(--selected);padding:5px 10px;font-weight:700}.content{padding:38px clamp(16px,4vw,56px);max-width:1120px;margin:auto}.hero,.panel,.sign-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:26px}.hero{margin-bottom:22px;background:linear-gradient(120deg,var(--surface),var(--soft))}.preview[data-theme=minimal] .hero{background:var(--surface)}.hero p,.panel p,.sign-card p{color:var(--muted)}h1,h2,p{margin:0 0 12px}h1{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.045em}h2{font-size:18px;letter-spacing:-.02em}.cards,.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.rows{list-style:none;padding:0;margin:0}.rows li{border-top:1px solid var(--line);padding:12px 0}.rows small{display:block;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.primary{background:var(--primary);color:white;border-color:transparent;font-weight:650}.search,textarea{width:100%;margin-bottom:16px}.sign-in{display:grid;place-items:center;min-height:740px;padding:24px;background:var(--atmosphere)}.sign-card{width:min(100%,420px);padding:34px}.sign-card .brand{margin-bottom:34px}.sign-card h1{font-size:34px}.google{width:100%;margin:12px 0}.sign-card small{display:block;color:var(--muted)}.bottom{justify-content:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px;background:var(--surface)}.bottom button{font-size:12px;padding:7px}.panel+.panel{margin-top:16px}.cards .panel+.panel,.editor .panel+.panel{margin:0}

.preview[data-width=mobile] .shell{grid-template-columns:1fr}.preview[data-width=mobile] aside,.preview[data-width=mobile] .search-link{display:none}.preview[data-width=mobile] .header .brand,.preview[data-width=mobile] .bottom{display:flex}.preview[data-width=mobile] .content{padding:22px 16px}.preview[data-width=mobile] :is(.cards,.editor){grid-template-columns:1fr}.preview[data-width=mobile] .header{padding:0 16px}

<body>
<header class="review"><strong>CosmicCore 2.0 design review</strong>
<label>Screen <select id="screen"></select></label>
<label>Appearance <select id="theme"><option value="cosmic">Cosmic</option><option value="minimal">Minimal</option></select></label>
<label>Minimal color <select id="scheme"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></label>
<label>Layout <select id="width"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select></label>
<label>Scenario <select id="state"><option value="typical">Typical</option><option value="empty">Empty</option><option value="error">Error</option></select></label>
</header>
<div class="preview" id="preview"></div>
<script>
const screens = ['Dashboard', 'Knowledge', 'References', 'Note editor', 'Import / Export', 'Trash', 'Settings', 'AI Chat', 'Sign-in'];
const controls = Object.fromEntries(['screen','theme','scheme','width','state'].map(id => [id, document.getElementById(id)]));
for (const name of screens) controls.screen.add(new Option(name));
const preview = document.querySelector('#preview');
const brand = '<span class="brand"><span class="mark" aria-hidden="true"></span><span>Cosmic<b>Core</b></span></span>';
const button = (label, go, primary = false) => `<button type="button"${go ? ` data-go="${go}"` : ' disabled'}${primary ? ' class="primary"' : ''}>${label}</button>`;
const panel = (title, body) => `<section class="panel"><h2>${title}</h2>${body}</section>`;
const rows = (items) => `<ul class="rows">${items.map(([title, detail]) => `<li>${title}<small>${detail}</small></li>`).join('')}</ul>`;
const notes = [['Learning log','Markdown note · Today'], ['Project questions','Markdown note · Yesterday']];
const refs = [['Design system reference','Reference · Today'], ['Postgres documentation','Reference · Yesterday']];
const knowledgeItems = [
  {title:'Designing a study routine that survives a busy week', type:'Note', tag:'Learning', screen:'Note editor'},
  {title:'Accessible design patterns for keyboard navigation and reflow', type:'Reference', tag:'Design systems', screen:'References'},
  {title:'Weekly learning log', type:'Note', tag:'Learning', screen:'Note editor'},
];
let query = "";
let filter = "";
let appearanceStatus = "";

function knowledge(state) {
  const items = knowledgeItems.filter(item => item.title.toLowerCase().includes(query.toLowerCase()) && (!filter || item.tag === filter));
  return `<section class="panel review-card" aria-label="Search Knowledge">
    <form class="search-form" id="knowledge-search">
      <label for="knowledge-query">Search notes and references</label>
      <div class="flow"><input class="search" id="knowledge-query" name="q" type="search" autocomplete="off" placeholder="E.g., learning log…"><button class="primary">Search</button></div>
    </form>
    <details class="filters"><summary>Filters</summary><form id="knowledge-filter" class="flow">
      <label for="filter-tag">Tag</label><select id="filter-tag" name="tag"><option value="">Any tag</option><option>Learning</option><option>Design systems</option></select>
      <button>Apply filters</button>
    </form></details>
    ${filter ? `<div class="flow"><button type="button" data-clear-filter aria-label="Remove filter: ${filter}">${filter} <span aria-hidden="true">×</span></button></div>` : ''}
  </section><section class="panel review-card" aria-labelledby="results-heading">
    <h2 id="results-heading" tabindex="-1">Results</h2>
    ${state === 'error' ? '<p role="alert">Search is temporarily unavailable. Your filters are still here.</p><button type="button" data-retry>Retry search</button>'
      : state === 'empty' || !items.length ? '<p>No matching notes or references. Try a shorter search or clear your filters.</p><button type="button" data-reset>Reset search</button>'
      : `<p role="status">${items.length} ${items.length === 1 ? 'result' : 'results'}</p><ul class="rows">${items.map(item => `<li class="result-row"><a href="#${item.screen.toLowerCase().replaceAll(' ', '-')}" data-go="${item.screen}">${item.title}</a><span class="result-meta">${item.type} · ${item.tag}</span></li>`).join('')}</ul>`}
  </section>`;
}

function appearanceSettings(state) {
  const selected = controls.theme.value;
  const saved = controls.scheme.value;
  const choice = (value, name, description) => `<button class="appearance-choice" type="button" data-theme-choice="${value}" aria-pressed="${selected === value}">
    <span class="swatch swatch-${value}${value === 'minimal' && (saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) ? ' swatch-minimal-dark' : ''}" aria-hidden="true">Weekly learning log</span>
    <strong>${name}${selected === value ? ' · Selected' : ''}</strong><small>${description}</small></button>`;
  return `<section class="panel review-card" aria-labelledby="appearance-title"><h2 id="appearance-title">Appearance</h2>
    <div class="appearance-grid" role="group" aria-label="Workspace appearance">
      ${choice('cosmic','Cosmic','Dark Nebula palette with planet artwork')}
      ${choice('minimal','Minimal','Neutral workspace with Light, Dark, and System')}
    </div>
    ${selected === 'minimal' ? `<div role="group" aria-label="Minimal color preference"><p>System follows your device appearance.</p>
      <div class="flow">${['light','dark','system'].map(value => `<button type="button" data-scheme-choice="${value}" aria-pressed="${saved === value}">${value[0].toUpperCase()+value.slice(1)}${saved === value ? ' · Selected' : ''}</button>`).join('')}</div></div>` : ''}
    <div class="review-status" role="status">${state === 'error' ? 'Appearance could not be saved. Your previous choice is still active.' : appearanceStatus}</div>
  </section>`;
}

function body(screen, state) {
  const message = (typical, empty, error) => state === 'typical' ? typical : `<p${state === 'error' ? ' role="alert"' : ''}>${state === 'empty' ? empty : error}</p>`;
  switch (screen) {
    case 'Dashboard':
      return `<section class="hero dashboard-hero">
        <h1>Your knowledge workspace</h1>
        <p>Capture an idea or pick up where you left off.</p>
        <div class="actions">${button('New note','Note editor',true)}${button('Save reference','References')}</div>
      </section>
      ${state === 'typical' ? '<div class="resume"><div><strong>Resume writing</strong><small>Learning log</small></div><button data-go="Note editor">Open note</button></div>' : ''}
      <div class="cards dashboard-recent">
        ${panel('Recent notes',message(rows(notes.map(([title, detail]) => [button(title,'Note editor'), detail])),'Your notes will appear here.','Recent notes could not load.'))}
        ${panel('Recent references',message(rows(refs.map(([title, detail]) => [button(title,'References'), detail])),'Your saved references will appear here.','Recent references could not load.'))}
      </div>`;
    case 'Knowledge':
      return knowledge(state);
    case 'Note editor':
      return panel('Markdown editor',`<div class="editor"><div><label for="draft">Edit</label><textarea id="draft" rows="7" placeholder="Start writing…">${state === 'empty' ? '' : '# Learning log\n\nCapture an idea here.'}</textarea></div>${panel('Preview',message('<p><strong>Learning log</strong></p><p>Capture an idea here.</p>','Markdown preview will appear here.','A newer version was saved. Your draft is still here.'))}</div>`);
    case 'Import / Export':
      return panel('Import Markdown','<p>Choose one .md file and review its contents before importing.</p>' + message('<p>File chooser and preview</p>','No file selected.','The selected file could not be read as Markdown.')) + panel('Export Markdown','<p>Download the last saved version of one note, or export all active notes as a ZIP.</p>');
    case 'Trash':
      return panel('Recently deleted','<p>Restore notes within seven days.</p>' + message(rows([['Scratch notes','Expires in 5 days · Restore']]),'Trash is empty.','Trash could not load.'));
    case 'AI Chat':
      return panel('Grounded chat is coming', '<p>Use Knowledge to find your saved notes and references.</p>' + button('Open Knowledge', 'Knowledge', true));
    case 'References':
      return panel('Saved references', message(rows(refs), 'No references saved yet.', 'References could not load.'));
    case 'Settings':
      return appearanceSettings(state) + panel('Google profile',message('<p>Signed in with Google</p>','Profile details are unavailable.','Profile could not load.')) + panel('Data and account',`<div class="actions">${button('Import / Export','Import / Export')}${button('Trash','Trash')}</div>`);
  }
}
function render() {
  const {screen, theme, scheme, width, state} = Object.fromEntries(Object.entries(controls).map(([key, field]) => [key, field.value]));
  const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const resolvedScheme = theme === 'cosmic' || scheme === 'dark' || (scheme === 'system' && systemDark) ? 'dark' : 'light';
  controls.scheme.disabled = theme === 'cosmic';
  Object.assign(preview.dataset, {theme, scheme: resolvedScheme, width, screen});
  if (screen === 'Sign-in') {
    preview.innerHTML = `<main class="sign-in"><section class="sign-card">${brand}<h1>Welcome back.</h1><p>Sign in to your private workspace.</p>${state === 'error' ? '<p role="alert">Google sign-in could not finish. Try again.</p>' : ''}<button class="google" data-go="Dashboard">Continue with Google</button><small>In this preview, the button opens the sample workspace.</small></section></main>`;
    return;
  }
  const nav = (entries) => entries.map(([route, label]) =>
    `<button data-go="${route}"${screen === route ? ' aria-current="page"' : ''}>${label}</button>`).join('');
  const main = [['Dashboard','Dashboard'], ['Knowledge','Knowledge'], ['Note editor','Notes'], ['AI Chat','Chat']];
  const utility = [['Trash','Trash'], ['Settings','Settings']];
  const desktop = nav([...main.slice(0, 3), ['References','References'], main[3]]);
  preview.innerHTML = `<div class="shell"><aside>${brand}<nav class="nav" aria-label="Workspace">${desktop}</nav><nav class="nav utilities" aria-label="Utilities">${nav(utility)}</nav></aside><div class="workspace"><header class="header">${brand}<button class="search-link" data-go="Knowledge">Search Knowledge</button><button class="avatar" data-go="Settings" aria-label="Open Settings">C</button></header><main class="content">${screen === 'Dashboard' ? '' : `<h1>${screen}</h1>`} ${body(screen,state)}</main></div></div><nav class="bottom" aria-label="Mobile workspace">${nav(main)}<details><summary>More</summary><div class="more-menu">${nav([['References','References'],['Import / Export','Import / Export'],...utility])}</div></details></nav>`;
  if (screen === 'Knowledge') {
    preview.querySelector('#knowledge-query').value = query;
    preview.querySelector('#filter-tag').value = filter;
  }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (controls.theme.value === 'minimal' && controls.scheme.value === 'system') render();
});
preview.addEventListener('submit', event => {
  if (!['knowledge-search','knowledge-filter'].includes(event.target.id)) return;
  event.preventDefault();
  if (event.target.id === 'knowledge-search') query = new FormData(event.target).get('q').trim();
  else filter = new FormData(event.target).get('tag');
  render();
  preview.querySelector('#results-heading').focus();
});
for (const field of Object.values(controls)) field.addEventListener('change', render);
preview.addEventListener('click', event => {
  const action = event.target.closest('[data-theme-choice],[data-scheme-choice],[data-reset],[data-retry],[data-clear-filter]');
  if (action) {
    const {themeChoice, schemeChoice} = action.dataset;
    if ((themeChoice || schemeChoice) && controls.state.value === 'error') return;
    if (themeChoice) controls.theme.value = themeChoice;
    if (schemeChoice) controls.scheme.value = schemeChoice;
    if (themeChoice || schemeChoice) appearanceStatus = 'Preview updated.';
    if (action.hasAttribute('data-reset')) { query = ''; filter = ''; controls.state.value = 'typical'; }
    if (action.hasAttribute('data-retry')) controls.state.value = 'typical';
    if (action.hasAttribute('data-clear-filter')) filter = '';
    render();
    const focus = themeChoice ? `[data-theme-choice="${themeChoice}"]`
      : schemeChoice ? `[data-scheme-choice="${schemeChoice}"]` : '#results-heading';
    preview.querySelector(focus)?.focus();
    return;
  }
  const control = event.target.closest('[data-go]');
  if (!control) return;
  event.preventDefault();
  controls.screen.value = control.dataset.go;
  render();
  controls.screen.focus();
});
render();
</script>
</body>
</html>
